<!doctype html>
<html lang="bg">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Задача 8: Генериране на таблица</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app">
      <h1>Задача 8: Генериране на таблица</h1>
      <input id="name" placeholder="Име...">
      <input id="age" type="number" placeholder="Възраст...">
      <button id="add">Добави</button>
      <table>
        <thead>
          <tr>
            <th>Име</th>
            <th>Възраст</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <script src="script.js"></script>
  </body>
</html>
